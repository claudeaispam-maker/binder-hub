<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Card Binder Hub</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#1a1208;color:#eee;
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 50% 0%,rgba(80,50,10,0.3) 0%,transparent 68%);
  pointer-events:none;
}

/* ── Header ── */
.hubHeader{
  flex-shrink:0;position:relative;z-index:10;
  padding:16px 20px 10px;text-align:center;width:100%;
}
.hubHeader h1{font-size:19px;color:#f0d070;font-weight:800;letter-spacing:.4px;text-shadow:0 2px 8px rgba(0,0,0,.6);}
.hubHeader p{font-size:11px;color:#8a7050;margin-top:2px;}

/* ── Scroll container ── */
.carouselWrap{flex:1;min-height:0;width:100%;overflow:hidden;position:relative;z-index:1;}

.carouselTrack{
  display:flex;
  align-items:center;
  height:100%;
  overflow-x:scroll;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
  scrollbar-width:none;
  gap:20px;
  /* padding centers the first/last card AND creates the peek of adjacent cards */
  padding-inline: max(10px, calc(50vw - 140px));
  padding-block:16px;
}
.carouselTrack::-webkit-scrollbar{display:none}

/* Wrapper owns snap — no transforms here, ever */
.cardWrapper{
  flex-shrink:0;
  width:280px;
  scroll-snap-align:center;
}

/* Card owns visuals — JS applies rotateY/scale/brightness */
.binderCard{
  width:280px;
  border-radius:16px;
  display:flex;flex-direction:column;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07);
  cursor:pointer;user-select:none;
  /* smooth out the per-frame transform updates */
  transition:transform 60ms linear, filter 60ms linear;
}

/* Spine */
.cardSpine{
  flex-shrink:0;height:54px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 18px;position:relative;
}
.cardSpine::after{
  content:'';position:absolute;bottom:0;left:14px;right:14px;
  height:1px;background:rgba(255,255,255,.09);
}
.spineName{font-size:17px;font-weight:800;color:#f0e0c0;letter-spacing:.3px;text-shadow:0 1px 4px rgba(0,0,0,.5);}
.spineIcon{font-size:24px;}

/* Thumbnail grid */
.thumbGrid{
  flex:1;display:grid;grid-template-columns:repeat(3,1fr);
  gap:5px;padding:12px;background:rgba(0,0,0,.25);
}
.thumb{aspect-ratio:.714;border-radius:5px;overflow:hidden;background:#1e1508;}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.thumb.empty{display:flex;align-items:center;justify-content:center;font-size:20px;color:rgba(255,255,255,.08);}

/* Footer */
.cardFooter{
  flex-shrink:0;padding:12px 18px 16px;
  display:flex;justify-content:space-between;align-items:flex-end;
  border-top:1px solid rgba(255,255,255,.07);
}
.stat .val{font-size:18px;font-weight:800;color:#f0e0c0;}
.stat .lbl{font-size:10px;color:#8a7050;margin-top:1px;letter-spacing:.3px;}
.statRow{display:flex;gap:16px;}
.lastUpd{font-size:10px;color:#5a4535;margin-top:5px;}
.openBtn{
  padding:10px 22px;border:none;border-radius:24px;
  font-size:13px;font-weight:700;cursor:pointer;color:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
  transition:transform .15s,filter .15s;flex-shrink:0;
}
.openBtn:active{transform:scale(.95);}

/* Not-loaded */
.notLoaded{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:24px;text-align:center;
}
.notLoaded .nlIcon{font-size:44px;opacity:.3;}
.notLoaded p{font-size:13px;color:#7a6040;line-height:1.6;max-width:200px;}
.notLoaded a{
  font-size:13px;font-weight:700;text-decoration:none;
  padding:8px 20px;border-radius:20px;border:1px solid;transition:filter .15s;
}

/* ── Dots ── */
.dots{
  flex-shrink:0;padding:14px 0 20px;
  display:flex;gap:9px;align-items:center;justify-content:center;
  position:relative;z-index:10;
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.18);
  cursor:pointer;transition:background .2s,transform .2s;
}
.dot.active{background:#f0d070;transform:scale(1.4);}

/* Mini binder cover */
.miniCover{
  flex:1; position:relative; overflow:hidden;
  min-height:155px; max-height:210px;
  display:flex; align-items:center; justify-content:center;
}
.miniCoverTexture{
  position:absolute; inset:0; pointer-events:none; z-index:1;
  background-image: repeating-linear-gradient(135deg, transparent 0 6px, rgba(0,0,0,0.18) 6px 7px);
}
.miniCoverVignette{
  position:absolute; inset:0; pointer-events:none; z-index:1;
}
.miniCoverContent{
  position:relative; z-index:2;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; padding:12px;
}
.miniFiremark{ width:52px; height:52px; filter:drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
.miniCoverTitle{
  color:#fff; font-family:Georgia,serif; font-weight:900;
  font-size:14px; text-align:center; letter-spacing:.5px;
}

/* Edge hint arrows */
.navHint{
  position:fixed;top:50%;transform:translateY(-50%);
  font-size:22px;color:rgba(240,208,112,.4);
  pointer-events:none;z-index:20;
  transition:opacity .3s;
}
#hintLeft{left:4px;}
#hintRight{right:4px;}
</style>
</head>
<body>

<div class="hubHeader">
  <h1>🗂 Card Binder Hub</h1>
  <p>Swipe to browse your collection</p>
</div>

<span id="hintLeft"  class="navHint">‹</span>
<span id="hintRight" class="navHint">›</span>

<div class="carouselWrap">
  <div class="carouselTrack" id="track"></div>
</div>

<div class="dots" id="dots"></div>

<script>
/* ── Registry ────────────────────────────────────────────── */
const BINDERS = [
  {
    key:    'melanies_binder_local_v1',
    name:   "Melanie's Binder",
    url:    'https://claudeaispam-maker.github.io/melanies-binder/melanies-binder.html',
    accent: '#c0392b',
    bg:     'linear-gradient(160deg,#2e0d0d 0%,#1a0808 100%)',
    icon:   '🎀',
    coverGrad:    'radial-gradient(circle at 30% 18%, #f5e6ff 0%, #c87dff 14%, #8830e8 34%, #4a0fa8 56%, #250570 76%, #0a0030 100%)',
    coverVignette:'radial-gradient(ellipse 70% 45% at 75% 85%,rgba(10,5,30,.65) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 15% 90%,rgba(10,5,30,.6) 0%,transparent 55%),radial-gradient(ellipse 50% 60% at 85% 10%,rgba(200,150,255,.3) 0%,transparent 50%)',
    titleShadow:  '0 2px 0 #2a006b,0 4px 10px rgba(0,0,0,.7),0 0 24px rgba(180,100,255,.75)',
    titleStroke:  '#1a0050',
    iconSvg:      '<path d="M58 14 C36 18 20 36 20 55 C20 74 38 90 60 88 C42 83 30 70 30 55 C30 40 42 27 58 22 Z" fill="#ddb8ff" stroke="#7700bb" stroke-width="2"/><circle cx="75" cy="22" r="4" fill="#ffe066"/><circle cx="68" cy="11" r="2.5" fill="#ffccff"/><circle cx="83" cy="34" r="2" fill="#ffffff"/>',
  },
  {
    key:    'louis_binder_local_v1',
    name:   "Loui's Binder",
    url:    'https://claudeaispam-maker.github.io/louis-binder/louis-binder.html',
    accent: '#1565c0',
    bg:     'linear-gradient(160deg,#0a1828 0%,#06101e 100%)',
    icon:   '🎮',
    coverGrad:    'radial-gradient(circle at 30% 18%, #fff6b0 0%, #ffd23f 14%, #ff9a1f 34%, #ff5b1f 56%, #e8290c 76%, #a8120a 100%)',
    coverVignette:'radial-gradient(ellipse 70% 45% at 75% 85%,rgba(40,10,5,.55) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 15% 90%,rgba(40,10,5,.5) 0%,transparent 55%),radial-gradient(ellipse 50% 60% at 85% 10%,rgba(255,255,255,.25) 0%,transparent 50%)',
    titleShadow:  '0 2px 0 #7a1505,0 4px 10px rgba(0,0,0,.7),0 0 24px rgba(255,150,0,.6)',
    titleStroke:  '#5c1004',
    iconSvg:      '<path d="M50 8 C40 22 30 30 30 46 C30 60 38 70 50 70 C62 70 70 60 70 46 C70 38 66 32 62 28 C63 38 58 42 53 40 C58 34 55 24 50 8 Z" fill="#ffe066" stroke="#7a1505" stroke-width="2"/><path d="M50 30 C45 38 42 44 42 52 C42 60 46 65 50 65 C54 65 58 60 58 52 C58 47 56 44 54 41 C54 47 51 49 49 47 C52 43 51 37 50 30 Z" fill="#ff7a1a" stroke="#7a1505" stroke-width="1.5"/>',
  },
];

/* ── Helpers ─────────────────────────────────────────────── */
function loadData(key){
  try{ const r=localStorage.getItem(key); return r?JSON.parse(r):null; }catch(e){ return null; }
}
function getStats(data){
  const cards=[];let lastTs=null;
  (data?.pages||[]).forEach(p=>(p||[]).forEach(s=>{
    if(!s)return;
    cards.push(s);
    if(s.addedAt&&(!lastTs||s.addedAt>lastTs))lastTs=s.addedAt;
  }));
  return{
    count:  cards.length,
    value:  cards.reduce((a,c)=>a+(Number(c.price)||0),0),
    images: cards.filter(c=>c.image).slice(0,6).map(c=>c.image),
    lastTs,
  };
}
function fmtDate(ts){
  if(!ts)return'No data yet';
  return new Date(ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function fmtVal(v){return v>0?'$'+v.toFixed(2):'—';}

/* ── Mini binder cover ───────────────────────────────────── */
function buildCoverBody(binder, data){
  const wrap=document.createElement('div');
  wrap.className='miniCover';

  if(data && data.coverImage){
    wrap.style.backgroundImage=`url(${data.coverImage})`;
    wrap.style.backgroundSize='cover';
    wrap.style.backgroundPosition='center';
  } else {
    wrap.style.background=binder.coverGrad||binder.bg;
  }

  const tex=document.createElement('div');
  tex.className='miniCoverTexture';
  wrap.appendChild(tex);

  const vig=document.createElement('div');
  vig.className='miniCoverVignette';
  if(binder.coverVignette) vig.style.background=binder.coverVignette;
  wrap.appendChild(vig);

  const content=document.createElement('div');
  content.className='miniCoverContent';

  if(binder.iconSvg){
    const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
    svg.setAttribute('viewBox','0 0 100 100');
    svg.setAttribute('class','miniFiremark');
    svg.innerHTML=binder.iconSvg;
    content.appendChild(svg);
  }

  const title=document.createElement('div');
  title.className='miniCoverTitle';
  title.textContent=binder.name;
  if(binder.titleShadow) title.style.textShadow=binder.titleShadow;
  if(binder.titleStroke) title.style.webkitTextStroke=`1px ${binder.titleStroke}`;
  content.appendChild(title);

  wrap.appendChild(content);
  return wrap;
}

/* ── Build card ──────────────────────────────────────────── */
function buildCard(binder, index){
  const data  = loadData(binder.key);
  const stats = getStats(data);

  /* Wrapper — owns the snap point, never transformed */
  const wrap = document.createElement('div');
  wrap.className = 'cardWrapper';

  /* Card — owns the visuals, receives JS transforms */
  const card = document.createElement('div');
  card.className = 'binderCard';
  card.style.background = binder.bg;
  card.dataset.index = index;

  /* Spine */
  const spine = document.createElement('div');
  spine.className = 'cardSpine';
  spine.style.background = binder.accent+'28';
  spine.innerHTML = `<span class="spineName">${binder.name}</span><span class="spineIcon">${binder.icon}</span>`;
  card.appendChild(spine);

  if(!data){
    const nl=document.createElement('div');
    nl.className='notLoaded';
    nl.innerHTML=`
      <div class="nlIcon">📂</div>
      <p>Open this binder once on this device so the Hub can read your collection.</p>
      <a href="${binder.url}" style="color:${binder.accent};border-color:${binder.accent}44;">Open to load →</a>
    `;
    card.appendChild(nl);
    const footer=document.createElement('div');
    footer.className='cardFooter';
    footer.innerHTML=`<div><div class="statRow"><div class="stat"><div class="val">—</div><div class="lbl">CARDS</div></div></div><div class="lastUpd">Not loaded on this device</div></div>`;
    card.appendChild(footer);
  } else {
    card.appendChild(buildCoverBody(binder, data));

    const footer=document.createElement('div');
    footer.className='cardFooter';
    const btn=document.createElement('button');
    btn.className='openBtn';
    btn.style.background=binder.accent;
    btn.textContent='Open →';
    btn.addEventListener('click',e=>{e.stopPropagation();window.location.href=binder.url;});
    footer.innerHTML=`
      <div>
        <div class="statRow">
          <div class="stat"><div class="val">${stats.count}</div><div class="lbl">CARDS</div></div>
          <div class="stat"><div class="val">${fmtVal(stats.value)}</div><div class="lbl">VALUE</div></div>
        </div>
        <div class="lastUpd">Updated ${fmtDate(stats.lastTs)}</div>
      </div>
    `;
    footer.appendChild(btn);
    card.appendChild(footer);
  }

  wrap.appendChild(card);
  return { wrap, card };
}

/* ── Init ────────────────────────────────────────────────── */
const track  = document.getElementById('track');
const dotsEl = document.getElementById('dots');
const wrappers = [], cards = [];
let current = 0;

BINDERS.forEach((binder, i) => {
  const { wrap, card } = buildCard(binder, i);
  wrappers.push(wrap);
  cards.push(card);
  track.appendChild(wrap);

  const dot = document.createElement('div');
  dot.className = 'dot'+(i===0?' active':'');
  dot.addEventListener('click', () => scrollToCard(i));
  dotsEl.appendChild(dot);
});

/* ── Scroll to a card ────────────────────────────────────── */
function scrollToCard(i){
  wrappers[i].scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
}

/* ── Tilt + dot sync ─────────────────────────────────────── */
let raf = null;
function onScroll(){
  if(raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(applyTilts);
}

function applyTilts(){
  const tr     = track.getBoundingClientRect();
  const center = tr.left + tr.width / 2;
  let   ci=0, cd=Infinity;

  wrappers.forEach((wrap, i) => {
    /* read the WRAPPER rect — untransformed, accurate snap position */
    const r   = wrap.getBoundingClientRect();
    const ctr = r.left + r.width / 2;
    const off = (ctr - center) / tr.width;   // –1 … +1

    const angle = off * 42;
    const scale = Math.max(0.80, 1 - Math.abs(off) * 0.22);
    const brite = Math.max(0.45, 1 - Math.abs(off) * 0.52);

    /* apply transform to the INNER CARD, never the wrapper */
    cards[i].style.transform = `perspective(900px) rotateY(${angle}deg) scale(${scale})`;
    cards[i].style.filter    = `brightness(${brite})`;

    const dist = Math.abs(ctr - center);
    if(dist < cd){ cd=dist; ci=i; }
  });

  if(ci !== current){
    current = ci;
    dotsEl.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===current));
  }
  document.getElementById('hintLeft').style.opacity  = current>0 ? '1':'0';
  document.getElementById('hintRight').style.opacity = current<cards.length-1 ? '1':'0';
}

track.addEventListener('scroll', onScroll, { passive:true });

/* ── Keyboard ────────────────────────────────────────────── */
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft'  && current>0)              scrollToCard(current-1);
  if(e.key==='ArrowRight' && current<cards.length-1) scrollToCard(current+1);
});

/* ── Initial render ──────────────────────────────────────── */
applyTilts();
requestAnimationFrame(applyTilts);
</script>
</body>
</html>
